<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI로 포켓몬 찾기 🌊</title>
    
    <style>
        :root {
            --bg-sky-main: #E0F2FE;
            --bg-sky-gradient: linear-gradient(135deg, #E0F2FE 0%, #BAE6FD 100%);
            --bg-card: #FFFFFF;
            --blue-light: #F0F9FF;
            --blue-mid: #7DD3FC;
            --blue-main: #38BDF8;
            --blue-dark: #0284C7;
            --blue-deep: #0369A1;
            --accent-orange: #FF8A3D;
            --accent-orange-hover: #E06C20;
            --text-main: #0F172A;
            --text-muted: #475569;
            --border-soft: #BAE6FD;
            --shadow-card: 0 16px 32px rgba(56, 189, 248, 0.18);
            --shadow-btn: 0 4px 14px rgba(3, 105, 161, 0.2);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-sky-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 16px;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 660px;
            margin: 0 auto;
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #FFFFFF;
            color: var(--blue-deep);
            font-weight: 800;
            font-size: 15px;
            padding: 6px 18px;
            border-radius: 30px;
            margin-bottom: 12px;
            border: 2px solid var(--blue-mid);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
        }

        h1 {
            font-size: 34px;
            font-weight: 900;
            color: #034694;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            word-break: keep-all;
        }

        .subtitle {
            font-size: 18px;
            color: var(--blue-deep);
            font-weight: 600;
            word-break: keep-all;
        }

        /* CARD CONTAINER */
        .view-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            border: 3px solid var(--border-soft);
            box-shadow: var(--shadow-card);
            transition: all 0.3s ease;
        }

        /* GRID VIEW (SELECTION) */
        .instruction {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 22px;
            color: var(--blue-deep);
        }

        .mbti-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        @media (max-width: 520px) {
            .mbti-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            h1 { font-size: 28px; }
            .subtitle { font-size: 16px; }
            .instruction { font-size: 18px; }
            .view-card { padding: 24px 16px; }
        }

        .mbti-btn {
            background: var(--blue-light);
            border: 2px solid var(--blue-mid);
            border-radius: var(--radius-md);
            padding: 16px 8px;
            font-size: 19px;
            font-weight: 900;
            color: var(--blue-deep);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(125, 211, 252, 0.25);
        }

        .mbti-btn:hover, .mbti-btn:focus {
            background: var(--blue-main);
            border-color: var(--blue-dark);
            color: #FFFFFF;
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 8px 18px rgba(56, 189, 248, 0.4);
            outline: none;
        }

        .mbti-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        /* RESULT VIEW */
        .result-container {
            display: none;
            text-align: center;
        }

        .result-container.active {
            display: block;
            animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .user-mbti-badge {
            display: inline-block;
            background: var(--blue-light);
            color: var(--blue-dark);
            font-size: 17px;
            font-weight: 800;
            padding: 8px 22px;
            border-radius: 30px;
            margin-bottom: 16px;
            border: 2px solid var(--blue-mid);
        }

        .pokemon-avatar {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            background: radial-gradient(circle, #FFFFFF 0%, #E0F2FE 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            border: 5px solid var(--blue-main);
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.35);
            user-select: none;
        }

        .pokemon-name-title {
            font-size: 30px;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .tag-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .tag {
            background: #F1F5F9;
            color: #475569;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 800;
        }

        .tag.highlight {
            background: #E0F2FE;
            color: var(--blue-deep);
            border: 1px solid var(--blue-mid);
        }

        .reason-box {
            background: var(--blue-light);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: left;
            border: 2px dashed var(--blue-mid);
            margin-bottom: 22px;
        }

        .reason-box h3 {
            font-size: 17px;
            color: var(--blue-deep);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
        }

        .reason-box p {
            font-size: 16px;
            color: #334155;
            word-break: keep-all;
            line-height: 1.75;
            font-weight: 600;
        }

        .chemistry-box {
            background: #F0FDF4;
            border: 2px solid #86EFAC;
            border-radius: var(--radius-md);
            padding: 18px 20px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
        }

        .chem-left {
            display: flex;
            flex-direction: column;
        }

        .chem-label {
            font-size: 13px;
            color: #166534;
            font-weight: 800;
        }

        .chem-value {
            font-size: 18px;
            font-weight: 900;
            color: #14532D;
            margin-top: 2px;
        }

        .chem-emoji {
            font-size: 36px;
        }

        .reset-btn {
            background: linear-gradient(135deg, var(--accent-orange) 0%, #FF5252 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            font-size: 19px;
            font-weight: 900;
            border-radius: var(--radius-md);
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .reset-btn:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 8px 20px rgba(255, 82, 82, 0.35);
        }

        .reset-btn:active {
            transform: translateY(0) scale(0.99);
        }

        footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--blue-deep);
            font-weight: 600;
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <span class="header-badge">🌊 POKÉMON & MBTI</span>
            <h1>MBTI로 포켓몬 찾기</h1>
            <p class="subtitle">나의 성격 유형과 꼭 닮은 운명의 포켓몬은?</p>
        </header>

        <main class="view-card">
            <!-- MBTI SELECTION GRID VIEW -->
            <div id="selectionView">
                <p class="instruction">본인의 MBTI 유형을 선택하세요!</p>
                <div class="mbti-grid" id="mbtiGrid">
                    <!-- Dynamic rendering via JS -->
                </div>
            </div>

            <!-- RESULT VIEW -->
            <div id="resultView" class="result-container">
                <span class="user-mbti-badge" id="mbtiBadge">MBTI</span>
                
                <div class="pokemon-avatar" id="pokeEmoji">
                    ❓
                </div>

                <h2 class="pokemon-name-title" id="pokeName">포켓몬 이름</h2>
                
                <div class="tag-container" id="pokeTags">
                    <!-- Dynamic Tag Elements -->
                </div>

                <div class="reason-box">
                    <h3>💡 이 포켓몬이 어울리는 이유</h3>
                    <p id="pokeReason">설명 내용이 들어갑니다.</p>
                </div>

                <div class="chemistry-box">
                    <div class="chem-left">
                        <span class="chem-label">❤️ 환상의 궁합 MBTI</span>
                        <span class="chem-value" id="chemText">MBTI - 포켓몬</span>
                    </div>
                    <div class="chem-emoji" id="chemEmoji">🤝</div>
                </div>

                <button class="reset-btn" onclick="resetSelection()">🔄 다시 고르기</button>
            </div>
        </main>

        <footer>
            <p>© MBTI 포켓몬 매칭 | 하늘색 파스텔 에디션</p>
        </footer>
    </div>

        // Render MBTI selection buttons dynamically
        function initGrid() {
            const gridContainer = document.getElementById('mbtiGrid');
            gridContainer.innerHTML = '';
            
            Object.keys(mbtiPokemonData).forEach(mbti => {
                const btn = document.createElement('button');
                btn.className = 'mbti-btn';
                btn.onclick = () => selectMBTI(mbti);
                btn.setAttribute('aria-label', `${mbti} 선택하기`);
                btn.innerHTML = `<div>${mbti}</div>`;
                gridContainer.appendChild(btn);
            });
        }

        // Show result view
        function selectMBTI(mbti) {
            const data = mbtiPokemonData[mbti];
            if (!data) return;

            document.getElementById('mbtiBadge').innerText = `MY MBTI: ${mbti}`;
            document.getElementById('pokeEmoji').innerText = data.emoji;
            document.getElementById('pokeName').innerText = `${mbti} - ${data.name}`;
            
            // Render tag badges
            const tagsContainer = document.getElementById('pokeTags');
            tagsContainer.innerHTML = data.tags.map((tag, idx) => 
                `<span class="tag ${idx === 0 ? 'highlight' : ''}">${tag}</span>`
            ).join('');

            document.getElementById('pokeReason').innerText = data.reason;
            
            // Render Best Chemistry Match
            document.getElementById('chemText').innerText = `${data.bestMatch} (${data.bestPoke})`;
            document.getElementById('chemEmoji').innerText = data.bestEmoji;

            // Display transition
            document.getElementById('selectionView').style.display = 'none';
            const resultView = document.getElementById('resultView');
            resultView.classList.add('active');

            // Smooth scroll top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Reset to initial screen
        function resetSelection() {
            const resultView = document.getElementById('resultView');
            resultView.classList.remove('active');
            document.getElementById('selectionView').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize on load
        window.onload = function() {
            initGrid();
        };
    </script>
</body>
</html>
